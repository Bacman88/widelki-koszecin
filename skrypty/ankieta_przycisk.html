<style>
.ank-fab{position:fixed;right:16px;bottom:calc(16px + var(--ank-off,0px));z-index:3500;display:flex;align-items:center;gap:10px;background:#00704f;color:#fff!important;text-decoration:none!important;font:700 15px/1.25 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:12px 18px 12px 14px;border-radius:999px;box-shadow:0 6px 20px rgba(0,0,0,.28);max-width:calc(100vw - 32px)}
.ank-fab .ank-i{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#fff;color:#00704f;font-size:17px;flex:none}
.ank-fab small{display:block;font-weight:500;font-size:12px;opacity:.9}
.ank-fab:hover{background:#005a3f}
.ank-fab::after{content:"";position:absolute;inset:-4px;border-radius:999px;border:3px solid #f6c700;animation:ank-puls 1.8s ease-out infinite;pointer-events:none}

</style>
