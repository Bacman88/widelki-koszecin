<text x="40" y="62" font-family="Inter" font-weight="800" font-size="28" fill="#10201c">Schemat linii – węzeł Koszęcin Rynek</text>
<text x="40" y="88" font-family="Inter" font-size="13" fill="#5b6b66">Schemat, nie mapa w skali. Gruba linia: co godzinę, cienka: co 2 godziny, przerywana: propozycje. Strzałki: dokąd można jechać dalej z końców linii.</text>
